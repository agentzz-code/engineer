<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b25"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon.svg"><link rel="stylesheet" href="styles.css"><title>Pocket Ledger</title></head><body><main class="app-shell"><header class="topbar"><div><p class="eyebrow" data-i18n="tagline">YOUR MONEY, CLEARLY</p><h1>Pocket Ledger</h1></div><div class="header-actions"><button id="languageButton" class="language-button" type="button">کوردی</button><button id="installButton" class="icon-button hidden" aria-label="Install app" title="Install app">⇩</button></div></header><section class="balance-card"><p data-i18n="balance">Current balance</p><strong id="balance">$0.00</strong><div class="summary-grid"><div><span class="income-dot"></span><small data-i18n="income">Income</small><b id="incomeTotal">$0.00</b></div><div><span class="expense-dot"></span><small data-i18n="spent">Spent</small><b id="expenseTotal">$0.00</b></div></div></section><section class="card"><div class="section-heading"><h2 data-i18n="addTransaction">Add transaction</h2></div><form id="transactionForm"><div class="type-toggle" role="group" aria-label="Transaction type"><button type="button" class="type-option active" data-type="expense" aria-label="Expense" title="Expense">🛒</button><button type="button" class="type-option" data-type="income" aria-label="Income" title="Income">💰</button><button type="button" class="type-option" data-type="rent" aria-label="Rent" title="Rent">🏠</button></div><p id="tabName" class="tab-name">Expense</p><label><span data-i18n="description">Description</span><input id="description" maxlength="60" placeholder="e.g. Groceries" required></label><div class="form-row"><label><span data-i18n="amount">Amount</span><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></label><label><span data-i18n="category">Category</span><select id="category"></select></label></div><label><span data-i18n="date">Date</span><input id="date" type="date" required></label><button class="primary-button" type="submit" data-i18n="addButton">Add transaction</button></form></section><section class="card transactions-card"><div class="section-heading"><h2 data-i18n="recent">Recent activity</h2><button id="clearButton" class="text-button" type="button" data-i18n="clear">Clear all</button></div><div id="transactions" class="transactions"></div></section></main><template id="transactionTemplate"><article class="transaction"><div class="transaction-icon"></div><div class="transaction-details"><b></b><small></small></div><div class="transaction-value"><b></b><button aria-label="Delete transaction" title="Delete transaction">×</button></div></article></template><script src="app.js"></script></body></html>
