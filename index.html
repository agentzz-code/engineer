<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102b25"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Welcome Engineer">
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="home-icon-180.png"><link rel="stylesheet" href="styles.css"><title>Welcome Engineer</title>
</head>
<body><main class="app-shell">
  <header class="topbar"><div class="brand"><h1>Welcome Engineer</h1></div><div class="header-actions"><a id="statsLink" href="stats.html" class="small-button" aria-label="Monthly stats">📊</a><button id="themeButton" class="small-button" type="button" aria-label="Dark mode">☾</button><button id="languageButton" class="small-button" type="button">کوردی</button></div></header>
  <section class="balance-card"><p data-t="balance">Current balance</p><strong id="balance">$0.00</strong><div class="summary-grid"><div><small data-t="income">Income</small><b id="incomeTotal">$0.00</b></div><div><small data-t="spent">Spent</small><b id="expenseTotal">$0.00</b></div></div></section>
  <section class="card"><div class="section-heading"><h2 data-t="statistics">Monthly statistics</h2><button id="calendarToggle" class="text-button" type="button"></button></div><div class="month-stats"><div><small data-t="income">Income</small><b id="monthIncome">$0.00</b></div><div><small data-t="spent">Spent</small><b id="monthExpense">$0.00</b></div><div><small data-t="balance">Balance</small><b id="monthBalance">$0.00</b></div></div><div id="calendarPanel" class="calendar-panel"><div class="calendar-header"><button id="previousMonth" type="button">‹</button><strong id="calendarTitle"></strong><button id="nextMonth" type="button">›</button></div><div class="calendar-weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div id="calendarDays" class="calendar-days"></div></div></section>
  <section class="card"><h2 data-t="add">Add transaction</h2><form id="transactionForm"><div class="type-toggle"><button type="button" class="type-option active" data-mode="expense" title="Expense">🛒</button><button type="button" class="type-option" data-mode="income" title="Income">💰</button><button type="button" class="type-option" data-mode="rent" title="Rent income">🏠</button></div><p id="tabName" class="tab-name"></p><label><span data-t="description">Description</span><input id="description" required></label><label><span data-t="amount">Amount</span><input id="amount" type="number" min="0.01" step="0.01" required></label><label><span data-t="category">Category</span><select id="category"></select></label><label><span data-t="repeat">Repeat</span><select id="repeat"><option value="once">One time</option><option value="daily">Daily</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label><label><span data-t="date">Date</span><input id="date" type="date" required></label><button class="primary-button" type="submit" data-t="add">Add transaction</button></form></section>
  <section class="card"><div class="section-heading"><h2 id="listingsHeading" data-t="listings">Listings</h2><div class="header-actions"><button id="dayFilterClear" class="text-button" type="button" style="display:none">✕</button><button id="clearButton" class="text-button" type="button" data-t="clear">Clear all</button></div></div><div id="transactions" class="transactions"></div></section>
</main><template id="transactionTemplate"><article class="transaction"><div class="transaction-icon"></div><div class="transaction-details"><b></b><small></small></div><div class="transaction-value"><b></b><button type="button">×</button></div></article></template><script src="app.js"></script></body></html>
