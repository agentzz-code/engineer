<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Pocket Ledger</title></head><body><main class="app-shell"><header class="topbar"><h1>Pocket Ledger</h1><button id="languageButton" class="language-button">کوردی</button></header><section class="balance-card"><p id="balanceLabel">Current balance</p><strong id="balance">$0.00</strong><div class="summary-grid"><div><small id="incomeLabel">Income</small><b id="incomeTotal">$0.00</b></div><div><small id="spentLabel">Spent</small><b id="expenseTotal">$0.00</b></div></div></section><section class="card"><h2 id="statsTitle">Monthly statistics</h2><div class="month-stats"><div><small id="monthIncomeLabel">Income</small><b id="monthIncome">$0.00</b></div><div><small id="monthExpenseLabel">Spent</small><b id="monthExpense">$0.00</b></div><div><small id="monthBalanceLabel">Balance</small><b id="monthBalance">$0.00</b></div></div><div class="calendar-header"><button id="previousMonth">‹</button><strong id="calendarTitle"></strong><button id="nextMonth">›</button></div><div class="calendar-weekdays"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div id="calendarDays" class="calendar-days"></div></section><section class="card"><h2 id="addTitle">Add transaction</h2><form id="transactionForm"><div class="type-toggle"><button type="button" class="type-option active" data-type="expense">🛒</button><button type="button" class="type-option" data-type="income">💰</button><button type="button" class="type-option" data-type="rent">🏠</button></div><p id="tabName">Expense</p><label id="descriptionLabel">Description<input id="description" required></label><label id="amountLabel">Amount<input id="amount" type="number" min="0.01" step="0.01" required></label><label id="categoryLabel">Category<select id="category"></select></label><label id="dateLabel">Date<input id="date" type="date" required></label><button id="addButton" class="primary-button">Add transaction</button></form></section><section class="card"><h2 id="recentTitle">Recent activity</h2><button id="clearButton" class="text-button" type="button">Clear all</button><div id="transactions" class="transactions"></div></section></main><template id="transactionTemplate"><article class="transaction"><div class="transaction-icon"></div><div class="transaction-details"><b></b><small></small></div><div class="transaction-value"><b></b><button type="button">×</button></div></article></template><script src="app.js"></script></body></html>
